<?xml version="1.0" encoding="UTF-8"?>
<!-- Chapter VI — Night flight: open sky, sea far below, motion trail -->
<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<!-- Sky — deep open night -->
<rect width="700" height="200" fill="#050810"/>
<rect x="0" y="0"   width="700" height="50"  fill="#040608"/>
<rect x="0" y="50"  width="700" height="60"  fill="#060910"/>
<rect x="0" y="110" width="700" height="60"  fill="#070a12"/>
<rect x="0" y="170" width="700" height="30"  fill="#090c14"/>
<!-- Stars — many, in flight you see them all -->
<rect x="22"  y="6"  width="2" height="2" fill="#e4dfc2" opacity="0.88"/>
<rect x="75"  y="20" width="2" height="2" fill="#ded8bc" opacity="0.82"/>
<rect x="140" y="12" width="2" height="2" fill="#e4dfbe" opacity="0.85"/>
<rect x="200" y="4"  width="2" height="2" fill="#e0dabe" opacity="0.90"/>
<rect x="268" y="16" width="2" height="2" fill="#dfd9bb" opacity="0.80"/>
<rect x="338" y="8"  width="2" height="2" fill="#e2dcc0" opacity="0.85"/>
<rect x="410" y="22" width="2" height="2" fill="#dfdabc" opacity="0.82"/>
<rect x="475" y="10" width="2" height="2" fill="#e2dcbe" opacity="0.87"/>
<rect x="548" y="18" width="2" height="2" fill="#e0daba" opacity="0.82"/>
<rect x="618" y="6"  width="2" height="2" fill="#e4dfbc" opacity="0.88"/>
<rect x="672" y="14" width="2" height="2" fill="#dfd9bb" opacity="0.80"/>
<!-- Gold-tinted stars -->
<rect x="48"  y="38" width="2" height="2" fill="#c9a84c" opacity="0.58"/>
<rect x="116" y="46" width="2" height="2" fill="#c9a84c" opacity="0.52"/>
<rect x="192" y="32" width="2" height="2" fill="#c9a84c" opacity="0.60"/>
<rect x="310" y="50" width="2" height="2" fill="#c9a84c" opacity="0.50"/>
<rect x="430" y="40" width="2" height="2" fill="#c9a84c" opacity="0.55"/>
<rect x="550" y="34" width="2" height="2" fill="#c9a84c" opacity="0.52"/>
<rect x="660" y="44" width="2" height="2" fill="#c9a84c" opacity="0.48"/>
<!-- Dim stars -->
<rect x="30"  y="68" width="1" height="1" fill="#808090" opacity="0.55"/>
<rect x="100" y="76" width="1" height="1" fill="#808090" opacity="0.50"/>
<rect x="170" y="62" width="1" height="1" fill="#808090" opacity="0.55"/>
<rect x="250" y="80" width="1" height="1" fill="#808090" opacity="0.48"/>
<rect x="380" y="70" width="1" height="1" fill="#808090" opacity="0.52"/>
<rect x="460" y="56" width="1" height="1" fill="#808090" opacity="0.55"/>
<rect x="560" y="74" width="1" height="1" fill="#808090" opacity="0.50"/>
<rect x="640" y="60" width="1" height="1" fill="#808090" opacity="0.48"/>
<!-- Moon (large, upper right) -->
<rect x="580" y="18" width="60" height="60" fill="#040608"/>
<rect x="586" y="24" width="48" height="48" fill="#cfc478" opacity="0.16"/>
<rect x="590" y="28" width="40" height="40" fill="#d0c87a" opacity="0.24"/>
<rect x="594" y="32" width="32" height="32" fill="#cfc472" opacity="0.36"/>
<rect x="598" y="36" width="24" height="24" fill="#c8be68" opacity="0.50"/>
<!-- Moon crescent shadow -->
<rect x="604" y="28" width="24" height="40" fill="#040608"/>
<rect x="606" y="26" width="22" height="44" fill="#040608"/>
<!-- Sea horizon at bottom -->
<rect x="0"   y="198" width="700" height="62" fill="#060c18"/>
<rect x="0"   y="198" width="700" height="8"  fill="#08101e"/>
<!-- Wave lines on sea -->
<rect x="0"   y="206" width="700" height="2"  fill="#0a1420" opacity="0.8"/>
<rect x="0"   y="214" width="700" height="2"  fill="#0c1622" opacity="0.7"/>
<rect x="0"   y="222" width="700" height="2"  fill="#0a1420" opacity="0.6"/>
<rect x="0"   y="230" width="700" height="2"  fill="#0c1622" opacity="0.5"/>
<!-- Moonlight shimmer on sea -->
<rect x="530" y="200" width="80" height="60" fill="#c0b860" opacity="0.04"/>
<rect x="550" y="204" width="40" height="56" fill="#c0b860" opacity="0.05"/>
<!-- Motion trail (Perseus flew through here) -->
<rect x="40"  y="118" width="200" height="2" fill="#c9a84c" opacity="0.08"/>
<rect x="44"  y="122" width="190" height="2" fill="#c9a84c" opacity="0.06"/>
<rect x="50"  y="128" width="170" height="2" fill="#c9a84c" opacity="0.04"/>
</svg>
