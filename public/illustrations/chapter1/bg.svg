<?xml version="1.0" encoding="UTF-8"?>
<!-- Chapter I background — pixel art feast hall. shape-rendering="crispEdges". -->
<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
<defs>

  <!-- ═══════════════════════════════════════════
       SYMBOL: wall-torch
       viewBox origin = top-left of flame tip
       total size: 20 wide × 160 tall
       ═══════════════════════════════════════════ -->
  <symbol id="torch" viewBox="0 0 20 160" overflow="visible">
    <!-- Flame — static layers (outermost → tip) -->
    <rect x="4"  y="0"  width="12" height="28" fill="#a02408"/>
    <rect x="6"  y="0"  width="8"  height="22" fill="#c84010"/>
    <rect x="7"  y="0"  width="6"  height="16" fill="#d87018"/>
    <rect x="8"  y="0"  width="4"  height="10" fill="#e09828"/>
    <!-- Torch cup / bowl -->
    <rect x="4"  y="26" width="12" height="6"  fill="#382a10"/>
    <rect x="6"  y="24" width="8"  height="4"  fill="#4a380e"/>
    <!-- Wall bracket -->
    <rect x="2"  y="30" width="16" height="6"  fill="#242038"/>
    <rect x="4"  y="36" width="12" height="8"  fill="#2c2840"/>
    <!-- Iron pole -->
    <rect x="8"  y="44" width="4"  height="116" fill="#1c1828"/>
  </symbol>

  <!-- ═══════════════════════════════════════════
       SYMBOL: candle
       viewBox origin = top of flame tip
       total size: 14 wide × 44 tall
       ═══════════════════════════════════════════ -->
  <symbol id="candle" viewBox="0 0 14 44" overflow="visible">
    <!-- Flame layers -->
    <rect x="5"  y="0"  width="4"  height="12" fill="#c83808"/>
    <rect x="6"  y="0"  width="2"  height="8"  fill="#e07018"/>
    <!-- Wick -->
    <rect x="6"  y="11" width="2"  height="4"  fill="#1a0e04"/>
    <!-- Wax body -->
    <rect x="5"  y="14" width="4"  height="22" fill="#c8a860"/>
    <rect x="5"  y="14" width="1"  height="22" fill="#e0c878" opacity="0.5"/>
    <!-- Holder dish -->
    <rect x="1"  y="36" width="12" height="4"  fill="#806010"/>
    <rect x="0"  y="38" width="14" height="2"  fill="#604808"/>
    <!-- Ambient glow on table -->
    <rect x="-4" y="36" width="22" height="8"  fill="#d06010" opacity="0.1"/>
  </symbol>

</defs>

