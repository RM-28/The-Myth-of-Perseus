  C 132,149 136,154 141,157 C 140,162 140,169 140,177
  L 140,182 L 184,182 L 184,177 C 184,169 184,162 183,157
  C 188,154 192,149 193,143 C 194,136 193,130 191,124
  C 197,114 200,101 199,91 C 198,83 193,76 186,71
  C 178,66 169,64 163,64 Z"
