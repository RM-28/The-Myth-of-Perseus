  L 153,196 C 154,192 157,189 160,188 L 163,188
  C 166,188 169,191 170,195 L 174,240
  C 175,243 177,246 180,246 L 187,246
  C 190,246 192,241 191,236 L 187,198 C 186,193 185,189 183,187 Z"
