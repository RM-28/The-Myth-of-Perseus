<!-- Chiton fold lines -->
<path d="M 148,190 L 145,244" stroke="#c8ba98" stroke-width="0.7" fill="none"/>
<path d="M 154,189 L 152,244" stroke="#c8ba98" stroke-width="0.7" fill="none"/>
<path d="M 160,188 L 160,245" stroke="#c8ba98" stroke-width="0.6" fill="none"/>
<path d="M 167,189 L 169,244" stroke="#c8ba98" stroke-width="0.7" fill="none"/>
<path d="M 174,190 L 178,244" stroke="#c8ba98" stroke-width="0.7" fill="none"/>

<!-- LEGS — bare from below chiton -->
