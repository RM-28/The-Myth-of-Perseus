  C 200,185 198,186 196,185 C 194,184 193,181 193,177
  C 193,170 194,163 194,155 L 195,144 C 193,141 191,136 190,130
  C 188,121 188,110 190,101 C 191,93 194,85 197,79 Z"
  fill="url(#skin)" stroke="#6a3010" stroke-width="1.3"/>

<!-- NEAR HAND (right, at side) -->
<path d="M 202,182 C 203,185 203,189 202,192 C 201,195 199,196 197,195
  C 195,194 194,191 194,188 C 194,185 195,183 196,182 Z"
  fill="url(#skin)" stroke="#6a3010" stroke-width="0.9"/>
<!-- Near hand fingers -->
<path d="M 203,186 C 205,188 205,191 204,192" stroke="#6a3010" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<path d="M 200,188 C 201,191 201,194 200,196" stroke="#6a3010" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<path d="M 197,188 C 197,191 197,194 198,196" stroke="#6a3010" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<path d="M 194,187 C 193,190 193,192 194,194" stroke="#6a3010" stroke-width="1.5" stroke-linecap="round" fill="none"/>

<!-- HEAD — 3/4 view, facing right -->
<path d="M 158,18 C 162,17 167,17 172,19 C 177,22 181,27 182,33
  C 183,39 182,46 179,50 C 177,53 173,55 169,56
  C 165,57 160,56 156,54 C 152,51 149,47 148,42
  C 147,37 148,31 151,27 C 153,22 156,19 158,18 Z"
