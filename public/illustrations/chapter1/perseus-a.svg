<path d="M 134,76 C 133,74 133,72 135,71 C 137,70 140,71 141,73"
  stroke="#1a0a04" stroke-width="3" stroke-linecap="round" fill="none"/>

<!-- EAR — right / near side -->
<path d="M 178,30 C 181,30 183,33 183,37 C 183,41 181,44 179,44
  C 178,44 177,43 177,41 C 177,38 177,34 178,30 Z"
  fill="url(#skin)" stroke="#6a3010" stroke-width="0.9"/>
<path d="M 178,33 C 179,35 179,39 178,41" fill="none" stroke="#7a3818" stroke-width="0.7"/>

<!-- ──────── FACE FEATURES ──────── -->
<!-- Eyebrow near (right) — strong, thick dark -->
<path d="M 161,25 C 165,23 171,23 175,25 C 176,26 176,28 175,28 C 171,27 165,27 162,28 Z"
  fill="#1c0a04"/>
<!-- Eyebrow far (left) — partially visible -->
<path d="M 153,26 C 156,25 160,25 162,26 C 163,27 162,28 161,28 C 159,28 156,28 154,28 Z"
  fill="#1c0a04"/>

<!-- Eye socket shadow near -->
<ellipse cx="168" cy="32" rx="7" ry="4.5" fill="#8a4828" opacity="0.35"/>
<!-- Sclera near eye -->
<path d="M 162,31 C 165,28 171,28 174,31 C 171,34 165,34 162,31 Z" fill="#ede0c4"/>
<!-- Iris -->
<circle cx="168" cy="31" r="3.3" fill="#1c0e06"/>
<!-- Pupil -->
<circle cx="168.5" cy="31" r="1.9" fill="#060402"/>
<!-- Catchlight -->
<circle cx="169.8" cy="29.8" r="0.95" fill="#fff5e0" opacity="0.85"/>
<!-- Upper lid -->
<path d="M 162,31 C 165,28 171,28 174,31" fill="none" stroke="#120804" stroke-width="1.7"/>
<!-- Lower lid subtle -->
<path d="M 162,31 C 165,34 171,34 174,31" fill="none" stroke="#120804" stroke-width="0.7"/>

<!-- Eye socket shadow far -->
<ellipse cx="158" cy="32" rx="5" ry="3.5" fill="#8a4828" opacity="0.25"/>
<!-- Far eye (partially visible) -->
<path d="M 154,31 C 156,29 160,29 163,31 C 160,33 156,33 154,31 Z" fill="#d8c8a4"/>
<circle cx="158.5" cy="31" r="2.5" fill="#1c0e06"/>
<path d="M 154,31 C 156,29 160,29 163,31" fill="none" stroke="#120804" stroke-width="1.4"/>

<!-- NOSE — 3/4 view, projecting rightward -->
<path d="M 163,26 C 163,29 164,33 165,37 C 167,40 170,42 173,42"
  fill="none" stroke="#8a4828" stroke-width="1.4" stroke-linecap="round"/>
<path d="M 170,41 C 172,40 174,39 175,37"
  fill="none" stroke="#8a4828" stroke-width="1.6" stroke-linecap="round"/>
<!-- Nostril hint -->
<path d="M 169,42 C 168,44 168,46 169,46"
  fill="none" stroke="#7a3818" stroke-width="1.1" stroke-linecap="round"/>

<!-- MOUTH — closed, jaw set, determined -->
<path d="M 158,47 C 162,45 166,45 170,47"
  fill="none" stroke="#8a3820" stroke-width="2.2" stroke-linecap="round"/>
<path d="M 158,48 C 162,50 166,50 170,48"
  fill="none" stroke="#8a3820" stroke-width="1.5" stroke-linecap="round"/>
<!-- Lip center line -->
<path d="M 158,47 C 162,46 166,46 170,47"
  fill="none" stroke="#5a2010" stroke-width="1.8" stroke-linecap="round"/>

<!-- Jawline definition -->
<path d="M 147,41 C 149,47 154,52 159,55"
  fill="none" stroke="#7a3818" stroke-width="0.8" opacity="0.6" stroke-linecap="round"/>

<!-- ──────── CHEST MUSCLE DEFINITION ──────── -->
<!-- Collarbone (near) -->
<path d="M 163,66 C 169,65 177,67 184,70"
