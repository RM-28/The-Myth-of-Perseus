<!-- Collarbone (far) -->
<path d="M 148,70 C 154,68 159,66 163,66"
  fill="none" stroke="#8a4828" stroke-width="1.0" stroke-linecap="round" opacity="0.55"/>
<!-- Sternum line -->
<path d="M 162,68 C 162,82 162,98 162,116 C 162,126 161,136 160,145"
