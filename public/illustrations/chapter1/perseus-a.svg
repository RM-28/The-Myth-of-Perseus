<path d="M 122,186 C 120,187 119,189 120,191" stroke="#5a2808" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<path d="M 125,188 C 123,190 123,193 124,195" stroke="#5a2808" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<path d="M 128,188 C 127,191 127,194 128,196" stroke="#5a2808" stroke-width="1.5" stroke-linecap="round" fill="none"/>
<path d="M 131,187 C 130,190 130,192 131,194" stroke="#5a2808" stroke-width="1.5" stroke-linecap="round" fill="none"/>

<!-- TORSO — bare muscular chest -->
<path d="M 163,64 C 155,64 146,66 138,71 C 131,76 126,83 125,91
