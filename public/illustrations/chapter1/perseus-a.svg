<!-- Hair side lock — frames left/far side of face -->
<path d="M 152,20 C 148,25 146,32 146,39" fill="none" stroke="#1a0a04" stroke-width="4" stroke-linecap="round"/>
<path d="M 150,22 C 146,28 144,36 145,44 C 146,49 148,53 151,55"
  fill="none" stroke="#120804" stroke-width="2.5" stroke-linecap="round"/>
