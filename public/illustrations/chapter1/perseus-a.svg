<!-- Near pec -->
<path d="M 163,68 C 168,71 174,78 177,87 C 178,93 177,99 172,101"
  fill="none" stroke="#7a3818" stroke-width="1.1" opacity="0.55"/>
<!-- Far pec -->
<path d="M 163,68 C 158,71 153,78 151,87 C 149,93 150,99 155,101"
  fill="none" stroke="#7a3818" stroke-width="1.0" opacity="0.45"/>
<!-- Abs lines -->
<path d="M 150,110 C 155,109 164,109 170,110" stroke="#8a4828" stroke-width="0.8" fill="none" opacity="0.5"/>
<path d="M 150,121 C 155,120 163,120 170,121" stroke="#8a4828" stroke-width="0.8" fill="none" opacity="0.5"/>
<path d="M 150,132 C 154,131 163,131 170,132" stroke="#8a4828" stroke-width="0.7" fill="none" opacity="0.45"/>
<!-- Oblique/side -->
<path d="M 140,156 C 143,147 148,138 155,130" stroke="#8a4828" stroke-width="0.9" fill="none" opacity="0.4"/>
<path d="M 184,156 C 181,147 176,138 169,130" stroke="#8a4828" stroke-width="0.9" fill="none" opacity="0.4"/>

<!-- BLUE HIMATION — front portion over left shoulder -->
<path d="M 138,72 C 136,78 135,86 135,95 C 135,105 137,116 140,125
  L 136,156 C 135,163 135,170 136,175
  C 137,178 139,178 141,176 C 143,172 144,164 145,155
  L 148,125 C 150,114 150,104 148,95 C 147,86 145,78 143,72 Z"
  fill="url(#blue)" stroke="#2a5282" stroke-width="1.0" opacity="0.88"/>

<!-- BELT/ZONE at waist -->
<path d="M 140,182 L 140,187 C 145,185 151,184 158,183 L 163,183
