<?xml version="1.0" encoding="UTF-8"?>
<!-- Perseus — Pose A: standing at ease, facing right toward Polydectes.
     Pre-quest Perseus at the feast. Bare chest, short white chiton, blue himation.
     Muscular heroic figure in the style of classical Greek illustration. -->
<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#d4956a"/>
    <stop offset="50%" stop-color="#b87248"/>
    <stop offset="100%" stop-color="#7a4020"/>
  </linearGradient>
  <linearGradient id="skinSh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9a5c30"/>
    <stop offset="100%" stop-color="#6a3010"/>
  </linearGradient>
  <linearGradient id="chiton" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#f2e8d0"/>
    <stop offset="65%" stop-color="#ddd0b0"/>
    <stop offset="100%" stop-color="#c0b090"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6898cc"/>
    <stop offset="55%" stop-color="#4a78a8"/>
    <stop offset="100%" stop-color="#2a5880"/>
  </linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#221408"/>
    <stop offset="100%" stop-color="#0a0604"/>
  </linearGradient>
  <linearGradient id="sandal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7a4820"/>
    <stop offset="100%" stop-color="#4a2008"/>
  </linearGradient>
</defs>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- BACK HAIR — dark mass behind head, falls to shoulders -->
<path d="M 165,18 C 160,17 154,18 149,22 C 145,26 142,32 140,40
  C 138,50 137,63 135,77 C 133,92 131,108 131,118
  C 131,125 132,128 134,128 C 136,127 137,123 138,116
  C 139,104 141,90 143,78 C 145,66 149,55 154,49
  C 157,44 162,42 166,43 Z"
  fill="url(#hair)"/>

<!-- BLUE HIMATION — back portion behind left arm -->
<path d="M 125,80 C 120,89 117,100 116,113 C 115,126 116,139 120,149
  C 122,155 126,160 130,162 C 132,163 134,161 135,158
  L 137,146 C 134,142 132,135 132,126 C 132,117 133,107 136,97
  C 138,88 142,81 146,76 Z"
  fill="url(#blue)" stroke="#2a5282" stroke-width="0.9"/>

<!-- FAR ARM (left, in shadow) — hanging at side -->
<path d="M 127,74 C 121,80 117,91 115,103 C 113,115 114,127 117,136
  C 118,140 120,143 123,144 L 124,162 C 124,170 124,177 125,182
  C 126,185 128,186 130,185 C 132,184 133,181 133,177
  C 133,170 132,163 132,155 L 131,144 C 133,141 135,136 136,130
  C 138,121 138,110 136,101 C 135,93 132,85 129,79 Z"
  fill="url(#skinSh)" stroke="#5a2808" stroke-width="1.1"/>

<!-- FAR HAND (left, at side) -->
<path d="M 124,182 C 122,185 121,189 122,192 C 123,195 126,197 128,196
  C 130,195 131,192 131,188 C 131,185 130,183 129,182 Z"
