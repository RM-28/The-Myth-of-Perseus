<path d="M 204,0 C 206,-3 208,-1 207,2 C 206,4 204,5 202,4" stroke="url(#skin)" stroke-width="7" stroke-linecap="round" fill="none"/>
<path d="M 199,1 C 200,-2 202,-1 201,2 C 200,4 198,5 197,4" stroke="url(#skin)" stroke-width="6.5" stroke-linecap="round" fill="none"/>
