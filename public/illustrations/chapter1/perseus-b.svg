<?xml version="1.0" encoding="UTF-8"?>
<!-- Perseus — Pose B: oath of defiance. Right arm raised, index finger
     pointing skyward (horkos gesture). Mouth open, brow furrowed with intensity.
     Everything identical to Pose A except the raised arm and facial expression. -->
<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="skin" x1="0.2" y1="0" x2="0.8" y2="1">
    <stop offset="0%" stop-color="#d4956a"/>
    <stop offset="50%" stop-color="#b87248"/>
    <stop offset="100%" stop-color="#7a4020"/>
  </linearGradient>
  <linearGradient id="skinSh" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#9a5c30"/>
    <stop offset="100%" stop-color="#6a3010"/>
  </linearGradient>
  <linearGradient id="chiton" x1="0" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#f2e8d0"/>
    <stop offset="65%" stop-color="#ddd0b0"/>
    <stop offset="100%" stop-color="#c0b090"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6898cc"/>
    <stop offset="55%" stop-color="#4a78a8"/>
    <stop offset="100%" stop-color="#2a5880"/>
  </linearGradient>
  <linearGradient id="hair" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#221408"/>
    <stop offset="100%" stop-color="#0a0604"/>
  </linearGradient>
  <linearGradient id="sandal" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7a4820"/>
    <stop offset="100%" stop-color="#4a2008"/>
  </linearGradient>
</defs>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- BACK HAIR -->
<path d="M 165,18 C 160,17 154,18 149,22 C 145,26 142,32 140,40
