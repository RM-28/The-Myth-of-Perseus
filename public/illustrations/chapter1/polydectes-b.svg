<path d="M 605,145 L 650,145 L 650,158 L 605,158 Z" fill="url(#throne)" stroke="#c8a030" stroke-width="0.9"/>
<path d="M 555,145 L 590,145 L 590,158 L 555,158 Z" fill="url(#throne)" stroke="#c8a030" stroke-width="0.9"/>
<!-- Throne legs -->
<rect x="558" y="188" width="12" height="64" rx="3" fill="url(#throne)" stroke="#c8a030" stroke-width="0.9"/>
<rect x="636" y="188" width="12" height="64" rx="3" fill="url(#throne)" stroke="#c8a030" stroke-width="0.9"/>
<ellipse cx="564" cy="252" rx="8" ry="4" fill="url(#gold)"/>
<ellipse cx="642" cy="252" rx="8" ry="4" fill="url(#gold)"/>

