<?xml version="1.0" encoding="UTF-8"?>
<!-- Polydectes — Pose B: right arm extended, pointing imperiously at Perseus.
     Mouth slightly open issuing his demand. Identical to Pose A except the
     near arm (left) is now extended forward pointing leftward. -->
<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="kskin" x1="0.8" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#c8886a"/>
    <stop offset="50%" stop-color="#a86840"/>
    <stop offset="100%" stop-color="#6e3e18"/>
  </linearGradient>
  <linearGradient id="kskinSh" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0%" stop-color="#8a5028"/>
    <stop offset="100%" stop-color="#5a2c0a"/>
  </linearGradient>
  <linearGradient id="robe" x1="0.8" y1="0" x2="0.2" y2="1">
    <stop offset="0%" stop-color="#7a1818"/>
    <stop offset="50%" stop-color="#4e0e0e"/>
    <stop offset="100%" stop-color="#280808"/>
  </linearGradient>
  <linearGradient id="throne" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#2a1a3a"/>
    <stop offset="100%" stop-color="#100812"/>
  </linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#e0b830"/>
    <stop offset="55%" stop-color="#c09010"/>
    <stop offset="100%" stop-color="#906808"/>
  </linearGradient>
  <linearGradient id="beard" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0%" stop-color="#6a5040"/>
    <stop offset="50%" stop-color="#4a3028"/>
    <stop offset="100%" stop-color="#2a1810"/>
  </linearGradient>
  <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6a2870"/>
    <stop offset="100%" stop-color="#3a1040"/>
  </linearGradient>
</defs>

<!-- ═══════════════════════════════════════════════════════ -->
<!-- THRONE BACK -->
<rect x="614" y="20" width="36" height="210" rx="4" fill="url(#throne)" stroke="#c8a030" stroke-width="1.2"/>
<rect x="618" y="28" width="28" height="40" rx="2" fill="none" stroke="#c8a030" stroke-width="0.8" opacity="0.7"/>
<rect x="618" y="76" width="28" height="40" rx="2" fill="none" stroke="#c8a030" stroke-width="0.8" opacity="0.7"/>
<rect x="618" y="124" width="28" height="40" rx="2" fill="none" stroke="#c8a030" stroke-width="0.8" opacity="0.7"/>
<!-- Throne seat -->
<path d="M 555,168 L 650,168 L 650,188 L 555,188 Z" fill="url(#throne)" stroke="#c8a030" stroke-width="1.0"/>
<path d="M 558,170 L 648,170 L 648,186 L 558,186 Z" fill="url(#cushion)" stroke="#5a2068" stroke-width="0.8"/>
