<path d="M 577,34 C 579,32 583,32 586,34" fill="none" stroke="#120804" stroke-width="1.3"/>

<!-- NOSE — aquiline, projecting left -->
<path d="M 580,30 C 580,33 579,36 578,39 C 576,42 572,44 569,44"
