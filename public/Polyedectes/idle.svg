<?xml version="1.0" encoding="UTF-8"?>
<!-- Polydectes idle animation — cycles Idle_West_0..3 at 6× scale.
     viewBox matches the chapter scene (700×260) so it layers directly.
     Sprite positioned right side, feet at y=258. -->
<svg viewBox="0 0 700 260" xmlns="http://www.w3.org/2000/svg">
<style>
  .pk { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* 4-frame sprite cycle — instant switch, no crossfade */
  @keyframes pk-f0 {
    0%,24.9% { opacity:1 }
    25%,100% { opacity:0 }
  }
  @keyframes pk-f1 {
    0%,24.9%  { opacity:0 }
    25%,49.9% { opacity:1 }
    50%,100%  { opacity:0 }
  }
  @keyframes pk-f2 {
    0%,49.9%  { opacity:0 }
    50%,74.9% { opacity:1 }
    75%,100%  { opacity:0 }
  }
  @keyframes pk-f3 {
    0%,74.9% { opacity:0 }
    75%,100% { opacity:1 }
  }
</style>

<!-- 24px × 32px sprite at 6× = 144×192px
     x=506  →  right edge at 650px (50px from right wall)
     y=66   →  bottom at 258px                              -->
<image class="pk"
  href="/Polyedectes/Idle_West_0.png"
  x="506" y="66" width="144" height="192"
  style="animation: pk-f0 0.6s steps(1,end) infinite;"/>
<image class="pk"
  href="/Polyedectes/Idle_West_1.png"
  x="506" y="66" width="144" height="192"
  style="animation: pk-f1 0.6s steps(1,end) infinite; opacity:0;"/>
<image class="pk"
  href="/Polyedectes/Idle_West_2.png"
  x="506" y="66" width="144" height="192"
  style="animation: pk-f2 0.6s steps(1,end) infinite; opacity:0;"/>
<image class="pk"
  href="/Polyedectes/Idle_West_3.png"
  x="506" y="66" width="144" height="192"
  style="animation: pk-f3 0.6s steps(1,end) infinite; opacity:0;"/>

</svg>
